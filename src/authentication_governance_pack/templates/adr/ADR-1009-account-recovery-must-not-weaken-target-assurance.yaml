  "title": "Account Recovery Must Not Weaken Target Assurance",
  "status": "accepted",
  "origin": "extension-pack",
  "summary": "Recovery and reset paths must preserve the assurance target of the account.",
  "body": "Repositories must treat account recovery, credential reset, authenticator replacement, and trusted referee flows as high-risk authentication lifecycle surfaces. Recovery evidence must show that attackers cannot use weaker recovery steps to bypass the target assurance level.",
