  "status": "accepted",
  "origin": "extension-pack",
  "summary": "Authentication governance requires audit and release evidence for successful, failed, and elevated authentication events.",
  "body": "Repositories must capture authentication method, authenticator class, assurance level, subject, relying party, timestamp, risk signal, session transition, failed attempts, recovery events, and step-up events as appropriate for release and incident evidence.",
