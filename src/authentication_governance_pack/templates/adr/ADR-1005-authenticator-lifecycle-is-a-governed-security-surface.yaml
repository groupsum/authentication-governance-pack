  "title": "Authenticator Lifecycle Is A Governed Security Surface",
  "status": "accepted",
  "origin": "extension-pack",
  "summary": "Authenticator binding, replacement, recovery, revocation, and rotation require explicit governance.",
  "body": "Repositories must define how authenticators are enrolled, bound, activated, replaced, recovered, suspended, revoked, and audited. Lifecycle steps must preserve the target assurance level and must not silently weaken the account.",
