  "title": "WebAuthn And FIDO Authenticators Are Phishing Resistant Authentication Surfaces",
  "status": "superseded",
  "origin": "extension-pack",
  "summary": "WebAuthn and FIDO authenticators provide public-key authentication surfaces that require explicit relying-party governance.",
  "body": "Repositories using WebAuthn or FIDO authenticators must govern relying-party identifiers, attestation policy, user verification, resident or discoverable credentials, authenticator attachment, credential backup or sync behavior, and recovery paths.",
