  "title": "OIDC ID Tokens Represent Authentication Events Not Permission Decisions",
  "status": "accepted",
  "origin": "extension-pack",
  "summary": "OIDC ID Tokens and authentication claims represent authentication events and identity context.",
  "body": "Repositories using OIDC must validate ID Token issuer, audience, expiry, nonce when applicable, subject, authentication context, and authentication methods. ID Token claims may inform authorization but must not act as complete permission decisions.",
