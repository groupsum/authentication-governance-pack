  "title": "Authentication Is Proof Of Claimant Control Not Resource Authorization",
  "status": "superseded",
  "origin": "extension-pack",
  "summary": "Authentication proves claimant control of authenticators for a subscriber account and does not decide resource permissions.",
  "body": "Repositories must govern authentication separately from authorization. A successful authentication event can establish subject identity, authenticator strength, and session context, but it must not grant resource actions without a separate authorization decision.",
  "decision_date": "2026-06-02",
